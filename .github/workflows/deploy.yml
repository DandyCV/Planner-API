name: "Deploy"
on:
  push:
    branches:
      - tech/aws-deploy
jobs:
  deploy:
    name: AWS EC2
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.AWS_EC2_APP_DIR }}"
            git fetch origin tech/aws-deploy
            git checkout tech/aws-deploy
            git pull origin tech/aws-deploy
            cat <<'EOF' > .env
            DATABASE_URL='${{ secrets.DATABASE_URL }}'
            RAILS_MASTER_KEY='${{ secrets.RAILS_MASTER_KEY }}'
            EOF
            docker compose down
            docker compose up -d --build
